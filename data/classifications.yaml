# Human-curated classifications for data/<source>/<id>/ records.
#
# Keyed by "<source>:<id>". Each entry fills:
#   - mes_relevance: core | adjacent | tangential
#   - mes_domains: subset of catalog schema enum
#   - data_kinds:   subset of catalog schema enum
#   - related_slugs.parameters: MESS-Parameters slugs this dataset touches
#   - related_slugs.materials:  MESS-Materials slugs this dataset touches
#   - reviewed_by / reviewed_at: provenance for this classification
#
# Semantics (from docs/architecture.md §2.3):
#   null     = not yet reviewed
#   []       = reviewed, confirmed empty (no relevant slug)
#   [slug..] = reviewed, these slugs apply
#
# build-catalog.py merges this into data/catalog.json (and per-source
# catalogs) on every rebuild. YAML wins over any prior catalog values.
#
# Referential integrity of the slug lists is CI-gated by
# scripts/validate-references.py — CI fails if any slug here doesn't
# resolve in the pinned MESS-Parameters / MESS-Materials slug lists.

reviewer_defaults:
  reviewed_by: claude-opus-4-7
  reviewed_at: "2026-04-20"

